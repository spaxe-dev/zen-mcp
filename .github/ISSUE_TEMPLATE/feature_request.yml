name: Feature request
description: Propose a capability or improvement for Zen MCP.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the behavior you want. Tool names, inputs, and outputs help.
    validations:
      required: true
  - type: textarea
    id: owned-browser-fit
    attributes:
      label: Fit with the owned-browser model
      description: |
        Zen MCP launches and owns its browser, keeps its Marionette listener
        closed after startup, and injects a fixed-code bridge. Explain how the
        proposal works inside that model, and whether it needs new browser
        permissions, URL handling, or background activity.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

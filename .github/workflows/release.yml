name: Release

# Publishes the scoped package @spaxe-dev/zen-mcp and the GitHub Release.
# The live Zen suite (npm run test:zen) is not run here: it needs a desktop
# session and a real Zen Browser, which hosted runners do not provide.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build, release, publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      - run: npm test

      - name: Pack tarball and checksums
        run: |
          npm pack
          version=$(node -p "require('./package.json').version")
          packed=$(ls ./*.tgz)
          mv "$packed" "zen-mcp-${version}.tgz"
          sha256sum "zen-mcp-${version}.tgz" > SHA256SUMS
          cat SHA256SUMS

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: zen-mcp-release
          path: |
            zen-mcp-*.tgz
            SHA256SUMS
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            zen-mcp-*.tgz \
            SHA256SUMS \
            --title "$TAG" \
            --generate-notes

      # Trusted publishing authenticates with this workflow's OIDC identity and
      # generates provenance, so no npm token is stored. This workflow must be
      # registered as a trusted publisher for @spaxe-dev/zen-mcp on npmjs.com.
      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/')
        run: npm publish --access public
